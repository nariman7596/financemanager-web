# Private-only stack that PULLS a prebuilt image instead of building on the box.
#
# Same isolation as docker-compose.private.yml — the app binds to 127.0.0.1 and
# Postgres is never published — but the image comes from GHCR, built by
# .github/workflows/build-image.yml on GitHub's runners.
#
# Use this on a small VPS. A Next.js production build needs several GB of RAM;
# a 1 vCPU / 1 GB server cannot finish one, while pulling a finished image takes
# seconds. Running the app is cheap (~250 MB) — only building is expensive.
#
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Update later: re-run those two commands. No rebuild, no downtime to speak of.
# See docs/DEPLOY-PRIVATE.md.
name: financemanager

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: financemanager
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fm -d financemanager"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Built and published by GitHub Actions. Override the tag with IMAGE_TAG in
    # .env to pin a specific build (the workflow also tags each commit sha).
    image: ghcr.io/nariman7596/financemanager-web:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fm:${DB_PASSWORD}@db:5432/financemanager?schema=public
      # Self-hosted Postgres is not pooled, so the direct URL is the same one.
      DIRECT_URL: postgresql://fm:${DB_PASSWORD}@db:5432/financemanager?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      # Encrypts transaction descriptions/notes, raw SMS and Plaid tokens.
      # NOT stored in the database — back it up separately (docs/ENCRYPTION.md).
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY in .env}
      STOCK_API_KEY: ${STOCK_API_KEY:-}
      # Set COOKIE_SECURE=false in .env when reaching the app over plain HTTP at
      # a VPN/LAN address. Not needed for an SSH tunnel to localhost.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      # Bound to a single address, never 0.0.0.0 — the port must not exist on
      # the public interface. Default is loopback (SSH tunnel / local only).
      #
      # A VPN peer arriving on wg0 CANNOT reach a socket bound to 127.0.0.1, so
      # for phone access over WireGuard set APP_BIND to the server's VPN address
      # in .env (e.g. APP_BIND=10.66.66.1). Still private: wg0 only exists
      # inside the tunnel.
      - "${APP_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal:
        aliases: [financemanager]

  # The transport the mobile client talks to. Same private posture as the web
  # app: bound to a single address, never 0.0.0.0. Reached over the SSH tunnel
  # or the VPN, exactly like the app.
  #
  # It does NOT apply migrations — the app container owns that, so the two
  # cannot race each other on startup.
  api:
    image: ghcr.io/nariman7596/financemanager-web-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fm:${DB_PASSWORD}@db:5432/financemanager?schema=public
      DIRECT_URL: postgresql://fm:${DB_PASSWORD}@db:5432/financemanager?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY in .env}
      API_PORT: 3001
    ports:
      - "${APP_BIND:-127.0.0.1}:3001:3001"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      internal:
        aliases: [financemanager-api]

  cron:
    # Tiny alpine+curl image; cheap enough to build anywhere, including here.
    build: ./deploy/cron
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
    depends_on:
      app:
        condition: service_started
    networks: [internal]

volumes:
  db-data:

networks:
  internal:

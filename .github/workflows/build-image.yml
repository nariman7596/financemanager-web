# Build the production image on GitHub's runners and publish it to GHCR.
#
# Why: a small VPS (1 vCPU / 1 GB RAM) cannot finish a Next.js production
# build — it thrashes and the OOM killer takes the box down. GitHub's runners
# have 4 cores and 16 GB, so the build happens here and the server only pulls
# a finished image, which takes seconds and almost no memory.
#
# Deploy on the server with docker-compose.ghcr.yml — see docs/DEPLOY-PRIVATE.md.

name: Build and publish image

on:
  push:
    branches: [main]
    # Skip runs for changes that cannot affect the image.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Feature branches need these jobs too — a gate that only runs on main tells
  # you the tree was broken after it is already the deploy candidate. Both
  # `verify` and `build` run here; only main publishes the image.
  pull_request:
    branches: [main]
  workflow_dispatch: # lets you rebuild by hand from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Typecheck and lint before spending time on an image build.
  #
  # This gate exists because a failed build is SILENT in production: the VPS
  # only ever pulls `:latest`, so when CI goes red the server keeps serving the
  # previous image and nothing announces that the deploy did not happen. That
  # has bitten this project twice. Catching it here costs about a minute.
  verify:
    runs-on: ubuntu-latest

    # The API suite drives the real compiled server against a real Postgres —
    # it is the household-isolation guarantee, and mocking the database would
    # test the mock instead of the guard.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fm
          POSTGRES_PASSWORD: fm
          POSTGRES_DB: financemanager_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fm"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://fm:fm@127.0.0.1:5432/financemanager_test?schema=public
      DIRECT_URL: postgresql://fm:fm@127.0.0.1:5432/financemanager_test?schema=public
      AUTH_SECRET: ci-only-secret-not-used-for-any-deployment-0000
      # 32 bytes of base64, CI-only. Real deployments generate their own with
      # `openssl rand -base64 32` and keep it out of the repository.
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  build:
    needs: verify
    # Runs on pull requests too, but only PUSHES from main (see `push:` below).
    # The Dockerfile is not exercised by any other job, so skipping this on PRs
    # meant a broken Dockerfile could only ever be discovered on main — which is
    # exactly how it was discovered. Building here costs a couple of minutes and
    # catches it before merge.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # provided automatically

      - name: Derive image tags (web)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Derive image tags (api)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          # MUST be explicit. Without a target Docker builds the LAST stage in
          # the Dockerfile, which is now api-runner — the web image would
          # silently become the API and the site would 404 everywhere.
          target: runner
          # The VPS is x86_64. Building only this platform keeps the job fast;
          # add linux/arm64 here if you ever deploy to an ARM server.
          platforms: linux/amd64
          # The `latest` tag is what the server pulls, so only main publishes.
          # A pull request builds the same image and throws it away.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers between runs so later builds are much quicker.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api-runner
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Deploy on the server with:" >> $GITHUB_STEP_SUMMARY
          echo '```sh' >> $GITHUB_STEP_SUMMARY
          echo "docker compose -f docker-compose.ghcr.yml pull" >> $GITHUB_STEP_SUMMARY
          echo "docker compose -f docker-compose.ghcr.yml up -d" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

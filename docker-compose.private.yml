# Private-only stack: the app is NOT exposed to the internet at all.
#
# Use this when the server already runs something on 443 (e.g. an Xray/Reality
# VPN) and you would rather not put a public domain on that IP — no DNS record,
# no certificate in the public Certificate Transparency logs, no open port.
#
# The app binds to 127.0.0.1 only. You reach it through an SSH tunnel, or over a
# private network you control (WireGuard/Tailscale). Postgres stays on a private
# Docker network and is never published.
#
#   cp .env.docker.example .env   (fill it in)
#   docker compose -f docker-compose.private.yml up -d --build
#
# See docs/DEPLOY-PRIVATE.md.
name: financemanager

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: financemanager
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fm -d financemanager"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      # MUST be explicit. Without it Docker builds the LAST stage in the
      # Dockerfile, which is api-runner — the web container would silently
      # start the API and every page would 404.
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fm:${DB_PASSWORD}@db:5432/financemanager?schema=public
      # Self-hosted Postgres is not pooled, so the direct URL is the same one.
      DIRECT_URL: postgresql://fm:${DB_PASSWORD}@db:5432/financemanager?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      # Encrypts transaction descriptions/notes, raw SMS and Plaid tokens.
      # Required: without it the app boots fine and then fails the first time
      # anyone saves a description. NOT stored in the database — back it up
      # separately (docs/ENCRYPTION.md).
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY in .env}
      STOCK_API_KEY: ${STOCK_API_KEY:-}
      # Session cookies are Secure by default, which browsers only send over
      # HTTPS (http://localhost counts as secure, so SSH tunnels are fine).
      # Reaching the app over plain HTTP at a VPN/LAN address needs this off,
      # which is only acceptable because nothing here is internet-facing.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      # The address prefix is the whole point: the port exists on exactly one
      # interface. Without it, Docker would publish on 0.0.0.0 and punch
      # straight through ufw (Docker writes its own iptables chain).
      #
      # Default 127.0.0.1 = loopback only. For phone access over WireGuard set
      # APP_BIND=10.66.66.1 in .env — a peer on wg0 cannot reach a socket bound
      # to loopback. Never set this to 0.0.0.0 or the public IP.
      - "${APP_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal:
        aliases: [financemanager]

  # The transport the mobile client talks to (Phase 4). Same private posture as
  # the app: bound to one address, never 0.0.0.0. It does NOT apply migrations —
  # the app container owns that, so the two cannot race on startup.
  api:
    build:
      context: .
      target: api-runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fm:${DB_PASSWORD}@db:5432/financemanager?schema=public
      DIRECT_URL: postgresql://fm:${DB_PASSWORD}@db:5432/financemanager?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY in .env}
      API_PORT: 3001
    ports:
      - "${APP_BIND:-127.0.0.1}:3001:3001"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      internal:
        aliases: [financemanager-api]

  cron:
    build: ./deploy/cron
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
    depends_on:
      app:
        condition: service_started
    networks: [internal]

volumes:
  db-data:

networks:
  internal:

# Production stack for FinanceManager: the app + its own Postgres, fully
# isolated. The app is reachable by the shared reverse proxy over the external
# `web` network (as "financemanager"); Postgres lives on a private network and
# is never exposed to the host or the proxy.
#
# Prereqs (once on the VPS):  docker network create web
# Then:  cp .env.docker.example .env  (fill it in)  &&  docker compose up -d --build
name: financemanager

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: financemanager
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fm -d financemanager"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      # MUST be explicit. Without it Docker builds the LAST stage in the
      # Dockerfile, which is api-runner — the web container would silently
      # start the API and every page would 404.
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://fm:${DB_PASSWORD}@db:5432/financemanager?schema=public
      # Self-hosted Postgres is not pooled, so the direct URL is the same one.
      # The Prisma datasource requires it (used for migrations).
      DIRECT_URL: postgresql://fm:${DB_PASSWORD}@db:5432/financemanager?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      # Encrypts transaction descriptions/notes, raw SMS and Plaid tokens.
      # Required: without it the app boots fine and then fails the first time
      # anyone saves a description. NOT stored in the database — back it up
      # separately (docs/ENCRYPTION.md).
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY in .env}
      STOCK_API_KEY: ${STOCK_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal:
      web:
        aliases: [financemanager]

  # Built-in scheduler: fires the app's cron endpoints (price refresh hourly,
  # recurring auto-post daily) — no host crontab needed. Reaches the app over
  # the `web` network as "financemanager".
  cron:
    build: ./deploy/cron
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
    depends_on:
      app:
        condition: service_started
    networks: [web]

volumes:
  db-data:

networks:
  internal:
  web:
    external: true
